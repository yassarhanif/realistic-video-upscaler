name: Build and Publish AI Worker Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo name for Docker image tag
        id: image-name
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/realistic-video-upscaler-worker"
          echo "IMAGE_NAME=$(echo $IMAGE_NAME | tr '[A-Z]' '[a-z]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.IMAGE_NAME }}:latest
            ${{ steps.image-name.outputs.IMAGE_NAME }}:v1
          cache-from: type=gha
          cache-to: type=gha,mode=max
